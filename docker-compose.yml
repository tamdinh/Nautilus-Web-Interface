# ─────────────────────────────────────────────────────────────────────────────
# Copy .env.example to .env and fill in the REQUIRED values before starting.
# The backend refuses to start with missing/weak secrets (ENVIRONMENT defaults to
# production). On Dokploy set the same variables in the application's Environment tab.
#
# The admin API is part of the backend (/api/admin/*, admin JWT required): there is
# no separate admin service or port any more.
# The app keeps state in-process and in SQLite: run exactly ONE backend replica.
# ─────────────────────────────────────────────────────────────────────────────

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Bound to localhost only; the public entrypoint is the reverse proxy (Traefik/Dokploy)
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      # Security — REQUIRED (compose aborts if unset)
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required (openssl rand -hex 32)}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required (>= 12 chars)}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (Fernet key; back it up separately from the DB)}"
      ENVIRONMENT: "${ENVIRONMENT:-production}"

      # CORS — set to your frontend URL in production, e.g. https://myapp.example.com
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}"

      # Reverse proxy IPs/CIDRs whose X-Forwarded-For header is trusted (real client IP for rate limits)
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"

      # Optional API key auth (leave empty to use JWT-only auth)
      API_KEY: "${API_KEY:-}"

      NAUTILUS_API_PORT: "8000"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-200}"
      LOGIN_RATE_LIMIT_PER_MINUTE: "${LOGIN_RATE_LIMIT_PER_MINUTE:-5}"
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # In production set these to your actual server URLs, e.g.:
        #   VITE_NAUTILUS_API_URL: "https://api.myapp.example.com"
        VITE_NAUTILUS_API_URL: "${VITE_NAUTILUS_API_URL:-http://localhost:8000}"
        VITE_WS_URL: "${VITE_WS_URL:-ws://localhost:8000}"
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.25"

volumes:
  backend_data:

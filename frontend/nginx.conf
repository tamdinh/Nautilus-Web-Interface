# nginx server block for the built SPA (copied to /etc/nginx/conf.d/default.conf).
# Runs in nginxinc/nginx-unprivileged: non-root, listens on 8080.
# TLS/HSTS are terminated by the reverse proxy (Traefik on Dokploy), not here.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # ── Security headers (also re-sent in nested locations, see below) ──────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Conservative CSP. The API/WebSocket origin is baked into the bundle at build time
    # (VITE_NAUTILUS_API_URL / VITE_WS_URL), so connect-src allows 'self' plus any TLS
    # origin, and plain localhost for local docker-compose. Tighten connect-src to the
    # exact API origin once it is fixed (ideal: serve API and WS from the same origin
    # behind the proxy and drop everything but 'self').
    # img-src deliberately does NOT allow third-party hosts: the 2FA QR code must be
    # rendered locally, never by sending the TOTP secret to an external QR service.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https: wss: http://localhost:* ws://localhost:*; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ── Hashed build assets: cache for a year ────────────────────────────────
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header in a location drops inherited ones, so repeat the security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── index.html must never be cached (it points at the current hashed assets) ─
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https: wss: http://localhost:* ws://localhost:*; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # ── SPA routing ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https: wss: http://localhost:* ws://localhost:*; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Simple liveness endpoint for the container healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
